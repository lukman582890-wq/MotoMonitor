name: Deploy MotoMonitor PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare dashboard preview
        run: |
          rm -rf site
          mkdir -p site
          cp dashboard-preview.html site/index.html
          cp mode-controller.js site/mode-controller.js
          cp dashboard-layout-v2.js site/dashboard-layout-v2.js
          cp navigation-final.js site/navigation-final.js
          cp mobile-dashboard-fix.css site/mobile-dashboard-fix.css
          cp navigation-v2.css site/navigation-v2.css
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          for tag in [
              '<script src="./navigation-controller.js" defer></script>',
              '<script src="./navigation-v2.js" defer></script>',
              '<script src="./map-click-hotfix.js" defer></script>',
              '<script src="./map-direct-v3.js" defer></script>',
              '<link rel="stylesheet" href="./navigation.css">'
          ]:
              html = html.replace(tag, '')
          inserts = [
              '<script src="./mode-controller.js" defer></script>',
              '<script src="./dashboard-layout-v2.js" defer></script>',
              '<script src="./navigation-final.js" defer></script>',
              '<link rel="stylesheet" href="./mobile-dashboard-fix.css">',
              '<link rel="stylesheet" href="./navigation-v2.css">'
          ]
          for tag in inserts:
              if tag not in html:
                  html = html.replace('</head>', tag + '\n</head>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
