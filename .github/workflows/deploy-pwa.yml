name: Deploy MotoMonitor PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare dashboard preview
        run: |
          rm -rf site
          mkdir -p site
          cp dashboard-preview.html site/index.html
          cp mode-controller.js site/mode-controller.js
          cp dashboard-layout-v2.js site/dashboard-layout-v2.js
          cp navigation-controller.js site/navigation-controller.js
          cp mobile-dashboard-fix.css site/mobile-dashboard-fix.css
          cp navigation.css site/navigation.css
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          mode = '<script src="./mode-controller.js" defer></script>'
          layout = '<script src="./dashboard-layout-v2.js" defer></script>'
          nav = '<script src="./navigation-controller.js" defer></script>'
          css = '<link rel="stylesheet" href="./mobile-dashboard-fix.css">'
          nav_css = '<link rel="stylesheet" href="./navigation.css">'
          for needle, insert in [(mode, mode), (layout, layout), (nav, nav)]:
              if needle not in html:
                  html = html.replace('</head>', f'{insert}\n</head>')
          for needle, insert in [(css, css), (nav_css, nav_css)]:
              if needle not in html:
                  html = html.replace('</head>', f'{insert}\n</head>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
