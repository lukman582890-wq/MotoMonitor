name: Deploy MotoMonitor PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare dashboard preview
        run: |
          rm -rf site
          mkdir -p site
          cp dashboard-preview.html site/index.html
          cp mode-controller.js site/mode-controller.js
          cp mobile-dashboard-fix.css site/mobile-dashboard-fix.css
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="./mode-controller.js" defer></script>'
          css = '<link rel="stylesheet" href="./mobile-dashboard-fix.css">'
          if tag not in html:
              html = html.replace('</head>', f'{tag}\n</head>')
          if css not in html:
              html = html.replace('</head>', f'{css}\n</head>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
