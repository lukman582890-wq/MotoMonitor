name: Build MotoMonitor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Patch JK BMS BLE picker
        run: node scripts/patch-bms-picker.mjs
      - name: Fix JK BMS runtime parser
        run: node scripts/fix-bms-parser.mjs
      - name: Fix dashboard patch script
        run: node scripts/fix-dashboard-script.mjs
      - name: Patch dashboard UI
        run: node scripts/patch-dashboard.mjs
      - name: Patch native GPS runtime
        run: node scripts/patch-gps-native.mjs
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Inject native Bluetooth transport
        run: node scripts/patch-android.mjs
      - name: Verify GPS integration
        run: node scripts/verify-gps-build.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoMonitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
